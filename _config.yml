# -------------------------------  Site basics  -------------------------------
title: blank                 # keep 'blank'; navbar shows your name (set below)
first_name: Sai Chaitanya
middle_name:
last_name: Susarla

# For a  <username>.github.io  user site these MUST be:
url: https://saichaitanya99.github.io
baseurl:                     # leave EMPTY for a user site

# ------------------------------  Author sidebar  -----------------------------
profile:
  align: right
  image: prof_pic.jpg        # TODO: put your photo at  assets/img/prof_pic.jpg
  image_circular: false
  more_info: >               # TODO: edit if needed
    <p>School of Physics & Astronomy</p>
    <p>University of Southampton</p>
    <p>Southampton, UK</p>

# ------------------------------  Social / IDs  -------------------------------
# Fill what you have; blank ones simply won't show an icon.
github_username: saichaitanya99
orcid_id:            # TODO  e.g. 0000-0002-1825-0097
scholar_userid:      # TODO  Google Scholar ID (string after user= in Scholar URL)
inspire_id:
ads_id:              # TODO  NASA ADS author link — matters in astronomy
research_gate:
email:               # TODO  work email (optional)
linkedin_username:   # TODO  optional
work_url:            # TODO  university staff page, optional

# ------------------------------  Site metadata  ------------------------------
keywords: pulsar timing, gravitational waves, simulation-based inference, radio astronomy, PTA
description: >
  Sai Chaitanya Susarla — postdoctoral researcher in pulsar astronomy at the
  University of Southampton, working on pulsar timing, simulation-based
  inference, and gravitational-wave detection.

# --------------------------------  Publications  -----------------------------
# Papers live in  _bibliography/papers.bib  (sample provided).
enable_google_scholar_citations: true
scholar:
  sort_by: year
  order: descending
  show_bibliography_bibtex: true
enable_publication_thumbnails: true

# ---------------------------------  Features  --------------------------------
enable_math: true            # MathJax — useful for methods
enable_darkmode: true
enable_medium_zoom: true
news: true                   # short "news" items on the About page
announcements: false

# --------------------------------  Defaults  ---------------------------------
lang: en
timezone: Europe/London
highlight_theme_light: github
highlight_theme_dark: native
